upstream api_backend {
    server api:8080;
}

upstream kuma_backend {
    server kuma:3001;
}

upstream dozzle_backend {
    server dozzle:8080;
}

server {
    listen 80;
    server_name api.ejemplo.local;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name kuma.ejemplo.local;

    location / {
        proxy_pass http://kuma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dozzle.ejemplo.local;

    location / {
        proxy_pass http://dozzle_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.ejemplo.local;

    ssl_certificate /etc/nginx/certs/api.ejemplo.local.crt;
    ssl_certificate_key /etc/nginx/certs/api.ejemplo.local.key;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name kuma.ejemplo.local;

    ssl_certificate /etc/nginx/certs/kuma.ejemplo.local.crt;
    ssl_certificate_key /etc/nginx/certs/kuma.ejemplo.local.key;

    location / {
        proxy_pass http://kuma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name dozzle.ejemplo.local;

    ssl_certificate /etc/nginx/certs/dozzle.ejemplo.local.crt;
    ssl_certificate_key /etc/nginx/certs/dozzle.ejemplo.local.key;

    location / {
        proxy_pass http://dozzle_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
