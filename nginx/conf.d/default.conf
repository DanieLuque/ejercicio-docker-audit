upstream api_backend {
    server api:8080;
}

upstream kuma_backend {
    server kuma:3001;
}

upstream dozzle_backend {
    server dozzle:8080;
}

server {
    listen 80;
    server_name api.fases1-5.duckdns.org;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name kuma.fases1-5.duckdns.org;

    location / {
        proxy_pass http://kuma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dozzle.fases1-5.duckdns.org;

    location / {
        proxy_pass http://dozzle_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
