upstream api_backend {
    server api:8080;
}

upstream kuma_backend {
    server kuma:3001;
}

upstream dozzle_backend {
    server dozzle:8080;
}

# Redirección automática de HTTP a HTTPS (Opcional pero recomendado)
server {
    listen 80;
    server_name fases1-5.duckdns.org kuma-fases1-5.duckdns.org dozzle-fases1-5.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------- HTTPS: API -----------------
server {
    listen 443 ssl;
    server_name fases1-5.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/fases1-5.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fases1-5.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------- HTTPS: KUMA -----------------
server {
    listen 443 ssl;
    server_name kuma-fases1-5.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/fases1-5.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fases1-5.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://kuma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets de Uptime Kuma
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ----------------- HTTPS: DOZZLE -----------------
server {
    listen 443 ssl;
    server_name dozzle-fases1-5.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/fases1-5.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fases1-5.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://dozzle_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets de Dozzle
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}