name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y análisis estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Run pytest
        run: pytest -v

      - name: Run bandit
        run: bandit -r . -x ./venv,./__pycache__ -f txt

  build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ejercicio-docker-audit:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  security:
    name: Análisis de vulnerabilidades
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for Trivy
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ejercicio-docker-audit:trivy
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ejercicio-docker-audit:trivy
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false

  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY_B64" ]; then
            echo "::error::Falta el secret DEPLOY_SSH_KEY_B64 en GitHub Actions"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Trust EC2 host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Falta el secret EC2_HOST en GitHub Actions"
            exit 1
          fi
          EC2_SSH_PORT="${EC2_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$EC2_SSH_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy application to EC2
        env:
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
        run: |
          if [ -z "$EC2_USERNAME" ]; then
            echo "::error::Falta el secret EC2_USERNAME en GitHub Actions"
            exit 1
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Falta el secret EC2_HOST en GitHub Actions"
            exit 1
          fi
          EC2_SSH_PORT="${EC2_SSH_PORT:-22}"
          EC2_PROJECT_PATH="${EC2_PROJECT_PATH:-/home/$EC2_USERNAME/ejercicio-docker-audit}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'nginx/certs' \
            -e "ssh -p $EC2_SSH_PORT" \
            ./ "$EC2_USERNAME@$EC2_HOST:$EC2_PROJECT_PATH/"

      - name: Restart services on EC2
        env:
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
        run: |
          if [ -z "$EC2_USERNAME" ] || [ -z "$EC2_HOST" ]; then
            echo "::error::Faltan EC2_USERNAME o EC2_HOST en GitHub Actions"
            exit 1
          fi
          EC2_SSH_PORT="${EC2_SSH_PORT:-22}"
          EC2_PROJECT_PATH="${EC2_PROJECT_PATH:-/home/$EC2_USERNAME/ejercicio-docker-audit}"
          ssh -p "$EC2_SSH_PORT" "$EC2_USERNAME@$EC2_HOST" "
            set -e
            cd '$EC2_PROJECT_PATH'
            docker compose pull
            docker compose build api
            docker compose up -d
            docker compose exec -T nginx nginx -t
            docker compose ps
          "
