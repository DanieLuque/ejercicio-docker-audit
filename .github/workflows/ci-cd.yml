  deploy:
    name: Despliegue en EC2
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secrets de despliegue
        run: |
          test -n "${{ secrets.EC2_HOST }}" || (echo "Falta EC2_HOST" && exit 1)
          test -n "${{ secrets.EC2_USERNAME }}" || (echo "Falta EC2_USERNAME" && exit 1)
          test -n "${{ secrets.EC2_SSH_KEY }}" || (echo "Falta EC2_SSH_KEY" && exit 1)
          test -n "${{ secrets.EC2_SSH_PORT }}" || (echo "Falta EC2_SSH_PORT" && exit 1)
          test -n "${{ secrets.EC2_PROJECT_PATH }}" || (echo "Falta EC2_PROJECT_PATH" && exit 1)
          echo "Todos los secrets de despliegue están configurados."

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "${{ secrets.EC2_SSH_PORT }}" \
            "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar en EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            -p "${{ secrets.EC2_SSH_PORT }}" \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.EC2_PROJECT_PATH }}"

            echo "Actualizando repositorio..."
            git pull origin main

            echo "Levantando servicios..."
            docker compose up -d --build

            echo "Estado de los servicios:"
            docker compose ps

          EOF

      - name: Limpiar clave SSH
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key