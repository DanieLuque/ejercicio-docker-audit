```yaml
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y análisis estático
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Run pytest
        run: pytest -v

      - name: Run bandit
        run: bandit -r . -x ./venv,./__pycache__ -f txt

  build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ejercicio-docker-audit:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  security:
    name: Análisis de vulnerabilidades
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for Trivy
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ejercicio-docker-audit:trivy
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ejercicio-docker-audit:trivy
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false

  deploy:
    name: Despliegue en EC2
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secrets de despliegue
        run: |
          test -n "${{ secrets.EC2_HOST }}" || (echo "Falta EC2_HOST" && exit 1)
          test -n "${{ secrets.EC2_USERNAME }}" || (echo "Falta EC2_USERNAME" && exit 1)
          test -n "${{ secrets.EC2_SSH_KEY }}" || (echo "Falta EC2_SSH_KEY" && exit 1)
          test -n "${{ secrets.EC2_SSH_PORT }}" || (echo "Falta EC2_SSH_PORT" && exit 1)
          test -n "${{ secrets.EC2_PROJECT_PATH }}" || (echo "Falta EC2_PROJECT_PATH" && exit 1)
          echo "Todos los secrets de despliegue están configurados."

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "${{ secrets.EC2_SSH_PORT }}" \
            "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar en EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            -p "${{ secrets.EC2_SSH_PORT }}" \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'
          set -e
          cd "${{ secrets.EC2_PROJECT_PATH }}"
          echo "Actualizando repositorio..."
          git pull origin main
          echo "Levantando servicios..."
          docker compose up -d --build
          echo "Estado de los servicios:"
          docker compose ps
          EOF

      - name: Limpiar clave SSH
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key
```
