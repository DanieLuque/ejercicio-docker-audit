name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y análisis estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Run pytest
        run: pytest -v

      - name: Run bandit
        run: bandit -r . -x ./venv,./__pycache__ -f txt

  build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ejercicio-docker-audit:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  security:
    name: Análisis de vulnerabilidades
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for Trivy
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ejercicio-docker-audit:trivy
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ejercicio-docker-audit:trivy
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false

  deploy:
    name: Despliegue preparado
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::warning::DEPLOY_SSH_KEY no configurado. Saltando despliegue."
            exit 0
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::warning::DEPLOY_HOST no configurado. Saltando despliegue."
            exit 0
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "::warning::DEPLOY_USER no configurado. Saltando despliegue."
            exit 0
          fi

      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy
          cp docker-compose.yml deploy/
          cp .env.example deploy/.env.example
          cp -r nginx deploy/
          echo "Artifact prepared for deployment" > deploy/README.txt

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: deploy/
          retention-days: 1
